<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad1)" opacity="0.2"/>
  
  <!-- Main Icon Background -->
  <rect x="20" y="20" width="88" height="88" rx="20" fill="#0a0b1e"/>
  <rect x="20" y="20" width="88" height="88" rx="20" fill="url(#grad1)" opacity="0.1"/>
  <rect x="20" y="20" width="88" height="88" rx="20" stroke="url(#grad1)" stroke-width="2" fill="none"/>
  
  <!-- Lightning Bolt Icon -->
  <path d="M 70 35 L 52 65 L 62 65 L 58 93 L 76 60 L 66 60 L 70 35 Z" 
        fill="url(#grad1)" 
        filter="url(#glow)"/>
  
  <!-- Accent Lines -->
  <line x1="30" y1="45" x2="45" y2="45" stroke="#00d9ff" stroke-width="2" opacity="0.6"/>
  <line x1="83" y1="83" x2="98" y2="83" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
  <circle cx="35" cy="85" r="2" fill="#00d9ff" opacity="0.8"/>
  <circle cx="93" cy="42" r="2" fill="#8b5cf6" opacity="0.8"/>
</svg>
